name: OxidanceCat Contribution Animation

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pillow requests

      - name: Run Factory Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python "${{ github.action_path }}/Render.py"

      - name: Commit and Push to Profile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update oxidancecat contribution animation"
          file_pattern: contribution_animation.png
