name: Profile
on:
  # Schedule daily updates
  schedule: [{cron: "0 8,23 * * *"}]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: OxidaneCat/Contribution-Graph-Custom-Video@main
        with:
          token: ${{ secrets.PERSONALTOKEN }}
